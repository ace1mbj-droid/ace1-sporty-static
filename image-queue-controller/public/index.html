<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Queue</title><style>body{font-family:system-ui;margin:0;background:#111;color:#eee}main{max-width:980px;margin:auto;padding:32px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.card{background:#1d1d1d;border:1px solid #333;border-radius:14px;padding:18px;margin:14px 0}button{padding:11px 18px;border-radius:10px;border:0;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #333}.completed{color:#64d98b}.failed{color:#ff7777}.generating{color:#ffd166}</style></head><body><main><h1>Continuous Image Queue</h1><div class="bar"><button onclick="act('start')">Start / Continue</button><button onclick="act('stop')">Pause</button><strong id="summary">Loading…</strong></div><div class="card"><table><thead><tr><th>#</th><th>Image</th><th>Status</th><th>Attempts</th><th>Output / Error</th></tr></thead><tbody id="items"></tbody></table></div></main><script>async function act(name){await fetch('/api/'+name,{method:'POST'});setTimeout(refresh,300)}async function refresh(){try{const s=await fetch('/api/status').then(r=>r.json());summary.textContent=`${s.status} · ${s.completed}/${s.total} completed · ${s.remaining} remaining · ${s.failed} failed`;items.innerHTML=s.items.map(i=>`<tr><td>${i.id}</td><td>${esc(i.title)}</td><td class="${i.state}">${i.state}</td><td>${i.attempts}</td><td>${esc(i.outputPath||i.error||'')}</td></tr>`).join('')}catch(e){summary.textContent=e.message}}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}refresh();setInterval(refresh,1500)</script></body></html>
